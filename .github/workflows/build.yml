name: Build Windows Exe (Tauri)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]        # 推送 v* 标签时自动创建 GitHub Release 并附安装包
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # 自带 WebView2
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 平时 push 只构建上传 artifact；打 v* 标签时由 tauri-action 创建 Release 并上传安装包
      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && '实验报告批阅系统 v__VERSION__' || '' }}
          releaseBody: 'Windows 安装包见下方 Assets（xxx-setup.exe）。更新内容见 说明文档 README.md。'
          releaseDraft: false
          prerelease: false

      - name: Upload NSIS bundle
        uses: actions/upload-artifact@v4
        with:
          name: report-grader-windows
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
